<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cubework — Tour Board</title>
<style>
  :root{
    /* "A1 — navy and amber" dark theme, picked 2026-07-27 after a few rounds
       of color-scheme review. --do is the amber brand/action accent (was
       Cubework's orange); --wait is a brighter blue reserved for selection
       rings and the "primary property" badge, so it stays visually distinct
       from the amber accent. --surface2 is a raised-element fill (unit rows,
       tabs, chips, inputs) one step lighter than --card, which itself sits
       one step lighter than the page --bg — three layers of depth instead of
       one flat white everywhere. */
    --do: #f59e0b; --wait: #3b82f6;
    --bg: #0b1220; --card: #0f172a; --surface2: #1e293b;
    --text: #e2e8f0; --text2: #94a3b8; --border: #263349;
    /* Cubework's real brand green (#38D430 — same hex used as the "every line
       is green" accent in the main app's document house style), added
       2026-07-27 (cont. #6) as a touch of brand green alongside the amber/
       orange accent, on top of the "Available" pill it already anchored. */
    --green-bg:#123018; --green-fg:#38D430;
    --gray-bg:#1e293b;  --gray-fg:#cbd5e1;
    --amber-bg:#3a2a10; --amber-fg:#fbbf24;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; -webkit-font-smoothing: antialiased;
  }
  #auth-screen{
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
  }
  .auth-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:32px; width:340px; box-shadow:0 4px 24px rgba(0,0,0,.5); }
  .auth-card h1{ font-size:20px; margin:0 0 4px; }
  .auth-card p.sub{ color:var(--text2); font-size:13px; margin:0 0 20px; }
  .auth-card input{ width:100%; padding:13px 12px; border:1px solid var(--border); border-radius:8px; font-size:16px; margin-bottom:10px; font-family:inherit; min-height:44px; color:var(--text); background:var(--surface2); }
  .auth-card button{ width:100%; padding:13px; border:none; border-radius:8px; background:var(--do); color:#1e1300; font-size:16px; font-weight:600; cursor:pointer; font-family:inherit; min-height:44px; }
  #auth-msg{ color:#fca5a5; font-size:13px; margin-top:10px; min-height:16px; }

  #app{ max-width:1100px; margin:0 auto; padding:0 16px 60px; }

  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--bg); padding:14px 0 10px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--green-fg); margin-bottom:16px;
  }
  header.topbar .brand{ font-weight:800; font-size:16px; letter-spacing:-.01em; }
  header.topbar .brand span{ color:var(--do); }
  .topbar-spacer{ flex:1; }
  .btn{ border:1px solid var(--border); background:var(--card); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--text); min-height:40px; }
  .btn:hover{ background:var(--surface2); }
  .btn.small{ padding:8px 12px; font-size:12px; min-height:36px; }
  .btn.danger{ color:#fca5a5; border-color:#7f1d1d; }
  .btn.primary{ background:var(--do); color:#1e1300; border-color:var(--do); font-weight:700; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .card h2{ font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.03em; color:var(--text2); }
  .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  select, input[type=text], input[type=number], textarea{
    border:1px solid var(--border); border-radius:8px; padding:10px 10px; font-size:16px; font-family:inherit; color:var(--text); background:var(--surface2); min-height:44px;
  }
  textarea{ width:100%; min-height:70px; resize:vertical; }
  label.field-label{ font-size:12px; color:var(--text2); display:block; margin-bottom:4px; }
  input[type=checkbox]{ accent-color: var(--do); }

  .sec{ border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .sec-hd{
    display:flex; align-items:center; justify-content:space-between; padding:12px 12px; cursor:pointer;
    background:var(--surface2); font-weight:700; font-size:13px; min-height:44px;
  }
  .sec-hd:hover{ background:#243252; }
  .sec-hd-right{ font-weight:400; font-size:12px; color:var(--text2); display:flex; align-items:center; gap:8px; }
  .sec-chevron{ display:inline-block; transition:transform .15s; }
  .sec-chevron.open{ transform:rotate(180deg); }
  .sec-body{ padding:8px; }

  .pill{ font-size:11px; padding:2px 9px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .unit-row{
    display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px;
    cursor:pointer; transition:box-shadow .12s, border-color .12s; background:var(--surface2);
  }
  .unit-row:hover{ border-color:#3b4a66; }
  .unit-row.hl{ box-shadow:0 0 0 2px var(--wait) inset; border-color:var(--wait); }
  .unit-row .u-id{ font-weight:700; font-size:13px; min-width:64px; }
  .unit-row .u-meta{ font-size:12px; color:var(--text2); min-width:110px; }

  .plan-wrap{ position:relative; width:100%; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--surface2); }
  .plan-wrap img{ display:block; width:100%; height:auto; }
  .plan-box{
    position:absolute; border-radius:5px; border:2px solid rgba(0,0,0,.35); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#e2e8f0;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .plan-box.hl{ box-shadow:0 0 0 3px var(--wait); border-color:var(--wait); }

  /* ── Configurator layout (added 2026-07-27, cont.) ─────────────────
     Two-column layout: tabbed content (Units / Site plan / Compare
     locations) on the left, a sticky "Deal summary" pricing panel on
     the right — replaces the old always-stacked card list. */
  .tb-grid{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:780px){ .tb-grid{ grid-template-columns:1fr; } .tb-sidebar{ position:static; } }
  .tb-tab{ border:1px solid var(--border); background:var(--surface2); border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--text2); min-height:40px; }
  .tb-tab:hover{ background:#243252; }
  .tb-tab.active{ background:var(--do); color:#1e1300; border-color:var(--do); font-weight:700; }
  .tb-sidebar{ background:#1c1509; border:1px solid #4d3a12; border-radius:var(--radius); padding:18px; position:sticky; top:70px; }
  .tb-sidebar h2{ color:var(--do); }
  .tb-cmp-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .tb-cmp-card{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; position:relative; background:var(--surface2); }
  .tb-cmp-card.primary{ border:2px solid var(--wait); }
  .tb-cmp-badge{ position:absolute; top:8px; right:8px; background:var(--wait); color:#fff; font-size:10px; font-weight:700; padding:2px 9px; border-radius:20px; }
  .tb-cmp-card .name{ font-weight:700; font-size:14px; padding-right:60px; }
  .tb-cmp-card .addr{ font-size:12px; color:var(--text2); margin-bottom:2px; }
  .tb-cmp-deal{ border-top:1px solid var(--border); margin-top:10px; padding-top:6px; }
  .tb-cmp-deal input{ font-size:14px; padding:8px; min-height:38px; }
  .tb-bar{ height:6px; border-radius:3px; background:var(--bg); margin:4px 0; overflow:hidden; }
  .tb-bar-fill{ height:100%; border-radius:3px; }
  .tb-chip{ border:1px solid var(--border); background:var(--surface2); border-radius:20px; padding:6px 13px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--text2); }
  .tb-chip:hover{ border-color:#3b4a66; }
  .tb-chip.active{ background:var(--wait); color:#fff; border-color:var(--wait); font-weight:700; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--text2); margin-bottom:4px; }
  #commute-map{ width:100%; height:260px; border-radius:8px; border:1px solid var(--border); margin-top:8px; }
  .commute-result{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .commute-result:last-child{ border-bottom:none; }
  .commute-dot{ width:12px; height:12px; border-radius:50%; margin-top:4px; flex-shrink:0; }

  .addon-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .addon-row:last-child{ border-bottom:none; }
  .addon-row label{ flex:1; font-size:15px; cursor:pointer; padding:6px 0; }
  .addon-row input[type=checkbox]{ width:22px; height:22px; flex-shrink:0; }
  .addon-row input[type=number]{ width:90px; min-height:40px; }
  .addon-check-list{ list-style:none; margin:0; padding:0; }
  .addon-check-list li{ padding:5px 0; font-size:14px; }

  .total-line{ display:flex; justify-content:space-between; font-size:14px; padding:6px 0; }
  .total-line.grand{ font-weight:800; font-size:16px; border-top:2px solid var(--green-fg); margin-top:6px; padding-top:10px; color:var(--do); }

  .muted{ color:var(--text2); font-size:13px; }
  .hint{ font-size:12px; color:var(--text2); margin-top:6px; }

  @media (max-width: 720px){ header.topbar .brand{ font-size:14px; } }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <h1>Cubework Tour Board</h1>
    <p class="sub">Staff sign-in required.</p>
    <input id="auth-email" type="text" placeholder="Email" autocomplete="username">
    <input id="auth-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doEmailSignIn()">Sign in</button>
    <div id="auth-msg"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand">Cubework <span>Tour Board</span></div>
    <div class="topbar-spacer"></div>
    <div id="topbar-extra"></div>
  </header>
  <div id="root"></div>
</div>

<!-- Leaflet (free, no API key) — powers the Commute modal's map. Loaded as a
     plain classic script (not a module import) so its global `L` is ready
     before the deferred module script below runs. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getStorage, ref, uploadBytes, getDownloadURL }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// Same do-or-wait Firebase project as index.html — this page reads live
// availability data and writes to two NEW collections (tour_sessions,
// tour_floorplans), both of which fall under firestore.rules' existing
// catch-all `match /{document=**} { allow read, write: if isAllowed(); }`
// rule — no rules change needed. Deliberately NOT reusing the Avail-only
// restricted role: this tool involves real pricing entry, so it's gated to
// the same full-access 3-email allowlist only.
const firebaseConfig = {
  apiKey:            "AIzaSyBQ-1dSWkXnh5Ju2lVKsUieCx3r-lZc08U",
  authDomain:        "do-or-wait.firebaseapp.com",
  projectId:         "do-or-wait",
  storageBucket:     "do-or-wait.firebasestorage.app",
  appId:             "1:502204732668:web:f6f11cc3b28288dc39f379"
};
const fbApp   = initializeApp(firebaseConfig);
const db      = getFirestore(fbApp);
const storage = getStorage(fbApp);
const auth    = getAuth(fbApp);

const ALLOWED_EMAILS = [
  'jchoustin91@gmail.com',
  'justin.cho@cubework.com',
  'cubeworkautomation@gmail.com'
];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── AUTH ──────────────────────────────────────────────────────────────
function authFail(e){
  const m = document.getElementById('auth-msg'); const c = String((e && (e.code || e.message)) || e);
  if (!m) return;
  if (c.includes('wrong-password') || c.includes('invalid-credential')) m.textContent = 'Wrong email or password.';
  else if (c.includes('user-not-found')) m.textContent = 'No account for that email.';
  else if (c.includes('too-many-requests')) m.textContent = 'Too many attempts — wait a moment and try again.';
  else m.textContent = 'Sign-in failed: ' + c;
}
window.doEmailSignIn = function(){
  const email = (document.getElementById('auth-email') || {}).value || '';
  const pass  = (document.getElementById('auth-pass')  || {}).value || '';
  if (!email || !pass) { const m = document.getElementById('auth-msg'); if (m) m.textContent = 'Enter your email and password.'; return; }
  signInWithEmailAndPassword(auth, email.trim().toLowerCase(), pass).catch(authFail);
};
window.doSignOut = function(){ signOut(auth); };

let _authReady = false;
onAuthStateChanged(auth, user => {
  const appEl = document.getElementById('app');
  const authEl = document.getElementById('auth-screen');
  const email = ((user && user.email) || '').toLowerCase();
  if (user && ALLOWED_EMAILS.includes(email)) {
    authEl.style.display = 'none';
    appEl.style.display = '';
    if (!_authReady) { _authReady = true; startLiveData(); }
  } else {
    if (user) {
      const m = document.getElementById('auth-msg');
      if (m) m.textContent = (email || 'That account') + ' isn’t authorized for the Tour Board.';
      signOut(auth);
    }
    appEl.style.display = 'none';
    authEl.style.display = 'flex';
  }
});

// ── Sync + reference links (added 2026-07-27) ──────────────────────
// Same Cloudflare Worker + n8n availability-sync webhook the main do-or-wait
// app's ⟳ button uses (workflow 4/5) — re-syncing here pulls fresh SharePoint
// data into the SAME `availability/{propId}` doc this page already reads live,
// so there's no separate sync path to maintain.
const PROXY        = 'https://plain-credit-5962.jchoustin91.workers.dev';
const AVAIL_WEBHOOK = `${PROXY}/webhook/availability-sync`;

// ── ADD-ONS (labels only — same categories Rate Bands uses) ─────────
const ADDONS = [
  ['dock', 'Dock Package'],
  ['cubicle_desk', 'Cubicle / Desk'],
  ['virtual_office', 'Virtual Office'],
  ['truck_container_pkg', 'Truck / Container Package'],
  ['sm_vehicle_pkg', 'Small Vehicle Package'],
  ['whse_wifi', 'Warehouse WiFi'],
  ['event_space', 'Event Space'],
  ['conf_room', 'Conference Room']
];

// ── STATE ─────────────────────────────────────────────────────────────
const availMap = {};                 // propId -> availability doc (live)
let tourSession = defaultSession();
let floorplanMap = {};                // propId -> tour_floorplans doc (or undefined = not loaded, null = none)
let unsubFloorplan = null;
let fpEditing = false;
let fpDraft = null;                   // { imageUrl, storagePath, boxes:[{unitId,x,y,w,h}] }
let fpPlaceUnit = '';
let fpUploading = false;
const expandedSections = new Set(); // 'propId::TYPE' — local UI state, collapsed by default
let activeTab = 'units'; // 'units' | 'plan' | 'compare' — local UI state, not persisted (same class as fpEditing/expandedSections)
let unitFilter = 'available'; // 'available' | 'hold' | 'occupied' | 'all' — Units tab status filter, local UI state, not persisted

// Commute modal state (added 2026-07-27, cont. #5) — local UI state, not
// persisted (the two addresses ARE persisted, on tourSession, since they
// describe the customer and stay relevant across whichever property you're
// looking at; the computed route/results are property-specific and are
// cleared whenever the primary property changes).
let commuteOpen = false;
let commuteLoading = false;
let commuteError = '';
let commuteResults = [];  // [{label, addr, miles, minutes, coords, color}]
let commuteDest = null;   // {lat, lon} of the current primary property, once geocoded
let commuteMap = null;    // the live Leaflet map instance, if drawn

function defaultSession(){
  return { customerName:'', primaryProp:'', compareProps:[], highlighted:{}, addons:{}, pricing:{ rate:'', sf:'', term:'', notes:'' }, comparePricing:{}, commuteAddr1:'', commuteAddr2:'' };
}

function startLiveData(){
  onSnapshot(collection(db, 'availability'), snap => {
    snap.forEach(d => { availMap[d.id] = d.data(); });
    snap.docChanges().forEach(c => { if (c.type === 'removed') delete availMap[c.doc.id]; });
    render();
  });
  onSnapshot(doc(db, 'tour_sessions', 'current'), snap => {
    if (snap.exists()) {
      const d = snap.data();
      tourSession = Object.assign(defaultSession(), d, {
        compareProps: d.compareProps || [],
        highlighted: d.highlighted || {},
        addons: d.addons || {},
        pricing: Object.assign({ rate:'', sf:'', term:'', notes:'' }, d.pricing || {}),
        comparePricing: d.comparePricing || {}
      });
      watchFloorplan(tourSession.primaryProp);
    }
    render();
  });
}

function saveSession(){
  setDoc(doc(db, 'tour_sessions', 'current'), Object.assign({}, tourSession, { updatedAt: new Date().toISOString() }), { merge: false }).catch(e => console.warn('save session', e));
}

function watchFloorplan(propId){
  if (unsubFloorplan) { unsubFloorplan(); unsubFloorplan = null; }
  if (!propId) { render(); return; }
  unsubFloorplan = onSnapshot(doc(db, 'tour_floorplans', propId), snap => {
    floorplanMap[propId] = snap.exists() ? snap.data() : null;
    render();
  });
}

// ── HELPERS ───────────────────────────────────────────────────────────
function fmtSf(n){ n = Number(n) || 0; return n ? n.toLocaleString() + ' sf' : '—'; }
function unitStatus(u){ return u.hold ? 'hold' : (u.available || u.hold) ? 'available' : 'occupied'; }
const PILLS = {
  available: ['var(--green-bg)', 'var(--green-fg)', 'Available'],
  occupied:  ['var(--gray-bg)',  'var(--gray-fg)',  'Occupied'],
  hold:      ['var(--amber-bg)', 'var(--amber-fg)', 'Hold']
};
function statusPillHtml(status){
  const [bg, fg, lbl] = PILLS[status] || PILLS.occupied;
  return `<span class="pill" style="background:${bg};color:${fg};">${lbl}</span>`;
}
function findUnit(propId, unitId){
  const d = availMap[propId]; if (!d) return null;
  return (d.units || []).find(u => String(u.unit || '').trim() === String(unitId).trim()) || null;
}
function sortedPropIds(){
  return Object.keys(availMap).sort((a, b) => String(availMap[a].property || a).localeCompare(String(availMap[b].property || b)));
}
function isHighlighted(propId, unitId){
  return ((tourSession.highlighted || {})[propId] || []).includes(unitId);
}

// ── ACTIONS (exposed on window — inline handlers) ────────────────────
window.setCustomerName = function(v){ tourSession.customerName = v; saveSession(); };
window.setPrimaryProp = function(propId){
  tourSession.primaryProp = propId;
  // Drop it from compareProps if it was already sitting there (e.g. it was
  // added as a comparison property earlier, then later picked as primary) —
  // otherwise Compare Locations would render the same property as two
  // separate cards (see the render-side dedupe below for a belt-and-braces
  // fix on any session that already has this stale state saved).
  tourSession.compareProps = tourSession.compareProps.filter(p => p !== propId);
  fpEditing = false; fpDraft = null;
  activeTab = 'units'; unitFilter = 'available';
  clearCommuteResults(); // the destination changed — old results (and any drawn route) no longer apply
  saveSession(); watchFloorplan(propId);
};
function clearCommuteResults(){
  commuteResults = []; commuteDest = null; commuteError = '';
  if (commuteMap) { commuteMap.remove(); commuteMap = null; }
}
window.setTab = function(t){ activeTab = t; render(); };
window.setUnitFilter = function(f){ unitFilter = f; render(); };
window.addCompareProp = function(propId){
  if (!propId || propId === tourSession.primaryProp) return;
  if (!tourSession.compareProps.includes(propId)) tourSession.compareProps.push(propId);
  saveSession(); render();
};
window.removeCompareProp = function(propId){
  tourSession.compareProps = tourSession.compareProps.filter(p => p !== propId);
  saveSession(); render();
};
// Per-property mini deal calculator shown on each Compare Locations card —
// deliberately separate from the shared tourSession.pricing (which drives the
// Deal Summary sidebar for whichever property is primary). Justin's ask
// (2026-07-28): when comparing, see each property's availability AND its own
// rough total, side by side — but skip add-ons/fees in this view since those
// don't vary much property to property; square footage is what actually
// differs, so this calc is deliberately just rate x sf, no add-ons, no term.
window.setComparePricing = function(propId, field, val){
  const cp = tourSession.comparePricing[propId] || (tourSession.comparePricing[propId] = { rate:'', sf:'' });
  cp[field] = val;
  saveSession(); render();
};
window.toggleHighlight = function(propId, unitId){
  const arr = tourSession.highlighted[propId] || (tourSession.highlighted[propId] = []);
  const i = arr.indexOf(unitId);
  if (i >= 0) arr.splice(i, 1); else arr.push(unitId);
  // Auto-fill the pricing sf field from whatever's highlighted on the primary
  // property, so a typed $/sf rate immediately computes a real number — the
  // field itself stays manually editable/overridable.
  if (propId === tourSession.primaryProp) {
    const totalSf = arr.reduce((sum, uid) => {
      const u = findUnit(propId, uid);
      return sum + (u ? Number(u.sf) || 0 : 0);
    }, 0);
    if (totalSf > 0) tourSession.pricing.sf = totalSf;
  }
  saveSession(); render();
};
window.toggleSection = function(key){
  if (expandedSections.has(key)) expandedSections.delete(key); else expandedSections.add(key);
  render();
};
window.toggleAddon = function(key){
  const a = tourSession.addons[key] || (tourSession.addons[key] = { checked:false, price:'' });

// Re-sync availability for the primary property from SharePoint (same webhook
// the main app's ⟳ button hits) — the availability listener already running on

window.triggerAvailSync = async function(propId){
  if (!propId) return;
  const btn = document.getElementById(`tour-sync-${propId}`);
  if (btn) { btn.textContent = '⟳ Syncing…'; btn.disabled = true; }
  const resetBtn = () => { if (btn) { btn.textContent = '⟳ Sync now'; btn.disabled = false; } };
  const timeout = setTimeout(resetBtn, 30000); // always reset after 30s, same as the main app
  try {
    await fetch(AVAIL_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ propId })
    });
  } catch (e) {
    clearTimeout(timeout);
    console.error('Sync trigger failed:', e);
    if (btn) { btn.textContent = '⚠ Sync failed'; btn.disabled = false; }
    setTimeout(resetBtn, 3000);
  }
};

// ── Commute modal (added 2026-07-27, cont. #5) ────────────────────────
// Justin's ask: enter up to 2 addresses and see a rough drive-time/mileage
// check to whichever property is primary right now. Deliberately built on
// FREE, no-API-key services rather than Google Maps (which needs a billing-
// enabled Google Cloud project) — Justin explicitly asked for a free option
// and said "don't need too many details, can be a rough view of the commute":
//   - Geocoding: OpenStreetMap's Nominatim (nominatim.openstreetmap.org) —
//     free, no key, but has a usage policy (max ~1 request/sec, no heavy/
//     commercial bulk use) that this low-volume internal tool respects by
//     geocoding one address at a time with a short pause between calls.
//   - Routing: OSRM's public demo server (router.project-osrm.org) — free,
//     no key, returns real driving distance/duration + route geometry. Its
//     own docs are explicit that this demo server is "for light/evaluation
//     use, not guaranteed uptime" — acceptable for a rough sales-conversation
//     check, but flagged here in case it ever goes down or rate-limits.
//   - Map rendering: Leaflet + OpenStreetMap tiles (loaded as a classic
//     script, see the <head> comment) — free, no key.
window.openCommuteModal = function(){
  commuteOpen = true; commuteError = '';
  render();
};
window.closeCommuteModal = function(){
  commuteOpen = false;
  if (commuteMap) { commuteMap.remove(); commuteMap = null; }
  render();
};
window.setCommuteAddr = function(n, v){
  tourSession['commuteAddr' + n] = v;
  saveSession();
};

async function geocode(address){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Couldn’t look up "' + address + '" — try a more specific address.');
  const data = await res.json();
  if (!data.length) throw new Error('No match found for "' + address + '" — try a more specific address.');
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
}

async function routeBetween(from, to){
  const url = `https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('The routing service is unavailable right now — try again in a moment.');
  const data = await res.json();
  if (!data.routes || !data.routes.length) throw new Error('No driving route found between those two points.');
  return data.routes[0];
}

window.computeCommute = async function(){
  const propId = tourSession.primaryProp;
  const d = availMap[propId] || {};
  if (!d.address) { commuteError = 'This property has no address on file yet.'; render(); return; }
  const addrs = [tourSession.commuteAddr1, tourSession.commuteAddr2].map(a => (a || '').trim()).filter(Boolean);
  if (!addrs.length) { commuteError = 'Enter at least one address.'; render(); return; }

  commuteLoading = true; commuteError = ''; commuteResults = []; render();
  const colors = ['#3b82f6', '#f59e0b'];
  try {
    const dest = await geocode(d.address);
    commuteDest = dest;
    const results = [];
    for (let i = 0; i < addrs.length; i++) {
      if (i > 0) await new Promise(r => setTimeout(r, 350)); // stay well under Nominatim's ~1 req/sec guidance
      const origin = await geocode(addrs[i]);
      const route = await routeBetween(origin, dest);
      results.push({
        label: 'Address ' + (i + 1), addr: addrs[i],
        miles: route.distance / 1609.34, minutes: Math.round(route.duration / 60),
        coords: route.geometry.coordinates, color: colors[i] || '#94a3b8'
      });
    }
    commuteResults = results;
    commuteLoading = false;
    render();
  } catch (e) {
    commuteLoading = false;
    commuteError = (e && e.message) || 'Something went wrong getting directions.';
    commuteDest = null;
    render();
  }
};

// Redraws the Leaflet map after every render() while the modal is open with
// results ready — render() rebuilds #root's innerHTML wholesale on ANY state
// change (not just commute-related ones), which would otherwise blow away the
// map's container div out from under a live Leaflet instance.
function maybeDrawCommuteMap(){
  if (!commuteOpen || !commuteResults.length || !commuteDest) return;
  requestAnimationFrame(drawCommuteMap);
}
function drawCommuteMap(){
  const el = document.getElementById('commute-map');
  if (!el || typeof L === 'undefined') return;
  if (commuteMap) { commuteMap.remove(); commuteMap = null; }
  commuteMap = L.map(el, { zoomControl: false }).setView([commuteDest.lat, commuteDest.lon], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(commuteMap);
  const bounds = [[commuteDest.lat, commuteDest.lon]];
  L.circleMarker([commuteDest.lat, commuteDest.lon], { radius: 7, color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 1 })
    .addTo(commuteMap).bindTooltip('Property');
  commuteResults.forEach(r => {
    const latlngs = r.coords.map(c => [c[1], c[0]]); // geojson is [lon,lat] — Leaflet wants [lat,lon]
    L.polyline(latlngs, { color: r.color, weight: 4 }).addTo(commuteMap);
    bounds.push(latlngs[0], latlngs[latlngs.length - 1]);
  });
  commuteMap.fitBounds(bounds, { padding: [28, 28] });
}

window.startFpEdit = function(){
  const propId = tourSession.primaryProp; if (!propId) return;
  const existing = floorplanMap[propId];
  fpDraft = existing ? JSON.parse(JSON.stringify(existing)) : { imageUrl:'', storagePath:'', boxes:[] };
  fpEditing = true;
  fpPlaceUnit = nextUnplacedUnit(propId);
  activeTab = 'plan';
  render();
};
window.cancelFpEdit = function(){ fpEditing = false; fpDraft = null; render(); };
window.setPlaceUnit = function(v){ fpPlaceUnit = v; };
function nextUnplacedUnit(propId){
  const placed = new Set((fpDraft ? fpDraft.boxes : []).map(b => b.unitId));
  const units = (availMap[propId] && availMap[propId].units) || [];
  const remaining = units.filter(u => !placed.has(u.unit));
  return remaining.length ? remaining[0].unit : '';
}
window.uploadPlanImage = async function(input){
  const file = input.files && input.files[0]; if (!file) return;
  if (!/^image\//.test(file.type)) { alert('Please choose an image file (PNG/JPG).'); return; }
  const propId = tourSession.primaryProp; if (!propId) return;
  fpUploading = true; render();
  try {
    const ext = (file.name.split('.').pop() || 'png').toLowerCase();
    // Reuses the already-permitted files/ Storage prefix (see Future Plan
    // feature note in do_or_wait/CLAUDE.md — a new prefix hits storage/unauthorized).
    const path = `files/tour-floorplan-${propId}-${Date.now()}.${ext}`;
    const sref = ref(storage, path);
    await uploadBytes(sref, file);
    const url = await getDownloadURL(sref);
    fpDraft.imageUrl = url;
    fpDraft.storagePath = path;
  } catch (e) {
    alert('Upload failed: ' + (e && e.message || e));
  }
  fpUploading = false; render();
};
window.onPlanClick = function(e){
  if (!fpEditing || !fpDraft) return;
  if (!fpDraft.imageUrl) return;
  if (!fpPlaceUnit) { alert('Every unit is already placed. Pick one to move, or remove a box first.'); return; }
  const rect = e.currentTarget.getBoundingClientRect();
  const w = 9, h = 7;
  let x = ((e.clientX - rect.left) / rect.width) * 100 - w / 2;
  let y = ((e.clientY - rect.top) / rect.height) * 100 - h / 2;
  x = Math.max(0, Math.min(100 - w, x));
  y = Math.max(0, Math.min(100 - h, y));
  fpDraft.boxes.push({ unitId: fpPlaceUnit, x, y, w, h });
  fpPlaceUnit = nextUnplacedUnit(tourSession.primaryProp);
  render();
};
window.removeFpBox = function(e, idx){
  e.stopPropagation();
  if (!fpEditing || !fpDraft) return;
  fpDraft.boxes.splice(idx, 1);
  fpPlaceUnit = nextUnplacedUnit(tourSession.primaryProp);
  render();
};
window.saveFpLayout = async function(){
  const propId = tourSession.primaryProp; if (!propId || !fpDraft) return;
  if (!fpDraft.imageUrl) { alert('Upload a site plan image first.'); return; }
  await setDoc(doc(db, 'tour_floorplans', propId), Object.assign({}, fpDraft, { updatedAt: new Date().toISOString() }));
  fpEditing = false; fpDraft = null; render();
};
window.removeFpPlan = async function(){
  const propId = tourSession.primaryProp; if (!propId) return;
  if (!confirm('Remove the mapped site plan for this property? (The unit list fallback will show instead. This does not affect live availability data.)')) return;
  await deleteDoc(doc(db, 'tour_floorplans', propId));
  fpEditing = false; fpDraft = null; render();
};

}

function renderUnitFilterBar(d){
  const units = d.units || [];
  const counts = { available: 0, hold: 0, occupied: 0 };
  units.forEach(u => { const s = unitStatus(u); counts[s] = (counts[s] || 0) + 1; });
  const opts = [
    ['available', 'Available', counts.available],
    ['hold', 'Hold', counts.hold],
    ['occupied', 'Occupied', counts.occupied],
    ['all', 'All', units.length]
  ];
  return `<div class="row" style="margin-bottom:12px;">

function renderCompareTab(){
  const primaryId = tourSession.primaryProp;
  // Dedupe against primaryId defensively — a session saved before the
  // setPrimaryProp fix above could still have the primary property sitting
  // in compareProps too, which would otherwise render it as two identical cards.
  const ids = [primaryId, ...tourSession.compareProps.filter(id => id !== primaryId)].filter(id => id && availMap[id]);
  const availIds = sortedPropIds().filter(id => id !== primaryId && !tourSession.compareProps.includes(id));
  const addRow = availIds.length
    ? `<select onchange="if(this.value){addCompareProp(this.value); this.value='';}" style="margin-bottom:12px;">
        <option value="">＋ Add a comparison property…</option>
        ${availIds.map(id => `<option value="${id}">${esc(availMap[id].property || id)}</option>`).join('')}
      </select>`
    : '';

  const maxWh  = Math.max(1, ...ids.map(id => (availMap[id].wh && availMap[id].wh.avail_sf) || 0));
  const maxOff = Math.max(1, ...ids.map(id => (availMap[id].office && availMap[id].office.avail_sf) || 0));

  const cards = ids.map(id => {
    const d = availMap[id];
    const whSf  = (d.wh && d.wh.avail_sf) || 0;
    const offSf = (d.office && d.office.avail_sf) || 0;
    const isPrimary = id === primaryId;
    const cp = tourSession.comparePricing[id] || { rate:'', sf:'' };
    const cpRate = Number(cp.rate) || 0;
    const cpSf = Number(cp.sf) || 0;
    const cpTotal = Math.round(cpRate * cpSf);
    return `<div class="tb-cmp-card${isPrimary ? ' primary' : ''}">
      ${isPrimary ? '<div class="tb-cmp-badge">Primary</div>' : ''}
      <div class="name">${esc(d.property || id)}</div>
      <div class="addr">${esc(d.address || '')}</div>
      <div class="muted" style="margin-top:8px;">Warehouse avail</div>
      <div class="tb-bar"><div class="tb-bar-fill" style="width:${Math.round(whSf / maxWh * 100)}%;background:var(--wait);"></div></div>
      <div style="font-weight:700;font-size:13px;margin-bottom:8px;">${fmtSf(whSf)}</div>
      <div class="muted">Office avail</div>
      <div class="tb-bar"><div class="tb-bar-fill" style="width:${Math.round(offSf / maxOff * 100)}%;background:var(--do);"></div></div>
      <div style="font-weight:700;font-size:13px;">${fmtSf(offSf)}</div>
      <div class="tb-cmp-deal">
        <div class="muted" style="margin-top:10px;">Rough total (sf only, no add-ons/fees)</div>
        <div class="row" style="gap:8px;margin-top:4px;flex-wrap:nowrap;">
          <div style="flex:1;min-width:0;">
            <label class="field-label">Rate ($/sf)</label>
            <input type="number" step="0.01" placeholder="$/sf" style="width:100%;" value="${esc(cp.rate)}" onchange="setComparePricing('${esc(id)}','rate',this.value)">
          </div>
          <div style="flex:1;min-width:0;">
            <label class="field-label">Square footage</label>
            <input type="number" placeholder="sf" style="width:100%;" value="${esc(cp.sf)}" onchange="setComparePricing('${esc(id)}','sf',this.value)">
          </div>
        </div>
        <div class="total-line grand" style="margin-top:8px;"><span>Total</span><span>$${cpTotal.toLocaleString()}/mo</span></div>
      </div>
      ${!isPrimary ? `<div style="margin-top:10px;"><button class="btn small danger" onclick="removeCompareProp('${esc(id)}')">Remove</button></div>` : ''}
    </div>`;
  }).join('');

  return `${addRow}<div class="tb-cmp-grid">${cards || '<div class="muted">No comparison properties added yet.</div>'}</div>`;
}

    return `<div class="plan-box${hl}" style="left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%;background:${bg};" onclick="toggleHighlight('${esc(propId)}','${esc(b.unitId)}')" title="${esc(b.unitId)} — ${status}">${esc(b.unitId)}</div>`;
  }).join('');
  return `<div class="plan-wrap"><img src="${esc(fp.imageUrl)}" alt="Site plan">${boxes}</div>`;
}

function renderFpEditor(propId){
  const units = (availMap[propId] && availMap[propId].units) || [];
  const placed = new Set((fpDraft.boxes || []).map(b => b.unitId));
  const remaining = units.filter(u => !placed.has(u.unit));
  const unitOpts = remaining.map(u => `<option value="${esc(u.unit)}" ${fpPlaceUnit === u.unit ? 'selected' : ''}>${esc(u.unit)} · ${fmtSf(u.sf)} · ${esc(u.type || '')}</option>`).join('');

  const uploadRow = `<div class="row" style="margin-bottom:10px;">
    <input type="file" accept="image/*" onchange="uploadPlanImage(this)">
    ${fpUploading ? '<span class="muted">Uploading…</span>' : ''}
  </div>`;

  if (!fpDraft.imageUrl) {
    return uploadRow + `<div class="muted">Upload the site plan image to start placing units.</div>
      <div class="row" style="margin-top:10px;"><button class="btn small" onclick="cancelFpEdit()">Cancel</button></div>`;
  }

  const boxes = (fpDraft.boxes || []).map((b, idx) => {
    const u = findUnit(propId, b.unitId);
    const status = u ? unitStatus(u) : 'occupied';
    const [bg] = PILLS[status] || PILLS.occupied;
    return `<div class="plan-box" style="left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%;background:${bg};" onclick="removeFpBox(event,${idx})" title="Click to remove">${esc(b.unitId)}</div>`;
  }).join('');

  return `${uploadRow}
    <div class="row" style="margin-bottom:8px;">
      <label class="field-label" style="margin:0;">Place next unit:</label>
      <select onchange="setPlaceUnit(this.value)">${unitOpts || '<option value="">All units placed</option>'}</select>
    </div>
    <div class="plan-wrap" onclick="onPlanClick(event)">
      <img src="${esc(fpDraft.imageUrl)}" alt="Site plan">
      ${boxes}
    </div>
    <div class="hint">Click anywhere on the plan to drop a box for the selected unit. Click an existing box to remove it.</div>
    <div class="row" style="margin-top:10px;">
      <button class="btn primary small" onclick="saveFpLayout()">💾 Save layout</button>
      <button class="btn small" onclick="cancelFpEdit()">Cancel</button>
    </div>`;
}

function renderGridView(propId, d){
  const allUnits = d.units || [];
  if (!allUnits.length) return `<div class="muted">No unit data synced for this property yet.</div>`;
  const units = unitFilter === 'all' ? allUnits : allUnits.filter(u => unitStatus(u) === unitFilter);
  const types = ['WH', 'OFFICE', 'DOCK', 'TRAILER', 'PARKING'];
  const groups = types.map(t => ({ t, list: units.filter(u => (u.type || '').toUpperCase() === t) })).filter(g => g.list.length);
  const others = units.filter(u => !types.includes((u.type || '').toUpperCase()));
  if (others.length) groups.push({ t: 'Other', list: others });
  if (!groups.length) return `<div class="muted">No ${unitFilter === 'all' ? '' : unitFilter + ' '}units for this property.</div>`;
  return groups.map(g => {
    const key = propId + '::' + g.t;
    const open = expandedSections.has(key);
    // When "All" is active, keep the original "N of M available" summary; a
    // specific status filter already scopes g.list to just that status, so a
    // plain count reads better than a now-redundant "N of N available".
    const headerRight = unitFilter === 'all'
      ? `${g.list.filter(u => unitStatus(u) !== 'occupied').length} of ${g.list.length} available`
      : `${g.list.length} unit${g.list.length !== 1 ? 's' : ''}`;
    const rows = g.list.map(u => {
      const status = unitStatus(u);
      const hl = isHighlighted(propId, u.unit) ? ' hl' : '';
      return `<div class="unit-row${hl}" onclick="toggleHighlight('${esc(propId)}','${esc(u.unit)}')">
        <span class="u-id">${esc(u.unit)}</span>
        <span class="u-meta">${fmtSf(u.sf)}</span>
        ${statusPillHtml(status)}
      </div>`;
    }).join('');
    return `<div class="sec">
      <div class="sec-hd" onclick="toggleSection('${esc(key)}')">
        <span>${esc(g.t)}</span>
        <span class="sec-hd-right">${headerRight} <span class="sec-chevron${open ? ' open' : ''}">▾</span></span>
      </div>
      ${open ? `<div class="sec-body">${rows}</div>` : ''}
    </div>`;
  }).join('');
}

function addonsSubtotal(){
  return ADDONS.reduce((sum, [key]) => {
    const a = tourSession.addons[key];
    return sum + (a && a.checked ? (Number(a.price) || 0) : 0);
  }, 0);
}

// The currently-highlighted units on the primary property, for the "N units ·
// X sf" readout at the top of Deal summary — a live reflection of whatever's
// clicked in the Units or Site plan tab.
function selectedUnitsSummary(){
  const propId = tourSession.primaryProp;
  const ids = (tourSession.highlighted[propId] || []);
  let sf = 0;
  ids.forEach(uid => { const u = findUnit(propId, uid); if (u) sf += Number(u.sf) || 0; });
  return { names: ids, sf };
}

// Sticky right-hand panel combining what used to be three separate stacked
// cards (Other locations / Add-ons / Pricing) into one live-updating "deal
// summary" — always visible next to whichever tab (Units/Site plan/Compare)
// is open on the left, since the price is what's being built the whole time.
function renderDealSummary(){
  const p = tourSession.pricing;
  const rate = Number(p.rate) || 0;
  const sf = Number(p.sf) || 0;
  const baseRent = Math.round(rate * sf);
  const addons = addonsSubtotal();
  const total = baseRent + addons;
  const sel = selectedUnitsSummary();

  return `<div class="tb-sidebar">
    <h2 style="margin-top:0;">Deal summary</h2>
    <div class="muted" style="margin-bottom:12px;">${sel.names.length ? esc(sel.names.join(', ')) + ' · ' + fmtSf(sel.sf) : 'No units selected yet'}</div>
    <div class="row" style="margin-bottom:10px;">
      <div style="flex:1;">
        <label class="field-label">Rate ($/sf/mo)</label>
        <input type="number" step="0.01" placeholder="$/sf" style="width:100%;" value="${esc(p.rate)}" onchange="setPricingField('rate', this.value)">
      </div>
      <div style="flex:1;">
        <label class="field-label">Square footage</label>
        <input type="number" placeholder="sf" style="width:100%;" value="${esc(p.sf)}" onchange="setPricingField('sf', this.value)">
      </div>
    </div>
    <label class="field-label">Term</label>
    <select style="width:100%;margin-bottom:4px;" onchange="setPricingField('term', this.value)">
      <option value="" ${!p.term ? 'selected' : ''}>—</option>
      ${['Month-to-month', '3 months', '6 months', '12 months', 'Custom'].map(t => `<option value="${t}" ${p.term === t ? 'selected' : ''}>${t}</option>`).join('')}
    </select>
    <div class="hint" style="margin:0 0 10px;">Square footage fills in automatically when you click a unit — still fine to type over it.</div>
    <div style="border-top:1px solid var(--border); margin:10px 0;"></div>
    ${ADDONS.map(([key, label]) => {
      const a = tourSession.addons[key] || { checked:false, price:'' };
      return `<div class="addon-row">
        <input type="checkbox" ${a.checked ? 'checked' : ''} onchange="toggleAddon('${key}')">
        <label onclick="toggleAddon('${key}')">${esc(label)}</label>
        ${a.checked ? `<input type="number" placeholder="$/mo" value="${esc(a.price)}" onchange="setAddonPrice('${key}', this.value)">` : ''}
      </div>`;
    }).join('')}
    <div class="total-line" style="margin-top:8px;"><span>Add-ons subtotal</span><span>$${addons.toLocaleString()}/mo</span></div>
    <div style="border-top:1px solid var(--border); margin:10px 0;"></div>
    <div class="total-line"><span>Base rent (rate × sf)</span><span>$${baseRent.toLocaleString()}/mo</span></div>
    <div class="total-line"><span>Add-ons</span><span>$${addons.toLocaleString()}/mo</span></div>
    <div class="total-line grand"><span>Total</span><span>$${total.toLocaleString()}/mo</span></div>
    <label class="field-label" style="margin-top:14px;">Notes</label>
    <textarea onchange="setPricingField('notes', this.value)">${esc(p.notes)}</textarea>
  </div>`;
}

render();
</script>
</body>
</html>
